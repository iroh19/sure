name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend — unit tests + decision-engine eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Syntax check
        run: python -m py_compile backend/main.py backend/rules.py

      # Safety-critical rule engine. The DO < 6 mg/L => always "critical"
      # guarantee is pinned here.
      - name: Unit tests
        working-directory: backend
        run: python -m pytest test_decision.py -v


      # Quality gate. eval.py imports backend/rules.py directly, so the engine
      # it measures is the one that ships. --rule-only needs no model; model mode
      # would require downloading weights and is not run in CI.
      - name: Knowledge-base consistency tests
        run: python -m pytest llm-service/test_knowledge.py -v

      - name: Agent tests
        run: python -m pytest llm-service/test_agent.py -v

      - name: Decision-engine eval gate
        working-directory: llm-service
        run: python eval.py --rule-only

  lint-frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, lint-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build llm-service image
        uses: docker/build-push-action@v6
        with:
          context: ./llm-service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build vision-service image
        uses: docker/build-push-action@v6
        with:
          context: ./vision-service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
