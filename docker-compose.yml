# ⚠️  HEDEF ORTAM: Linux + NVIDIA GPU.
# llm-service nvidia GPU reserve eder → Apple Silicon (Mac) üzerinde Docker ile
# ÇALIŞMAZ. Mac demosu servisleri native çalıştırır (bkz. README "Native çalıştırma").
# Bu compose yalnızca GPU'lu bir Linux makinesinde kullanılmalıdır.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/../data:ro
      - backend-db:/app/db          # SQLite kalıcı depolama
    environment:
      - LLM_SERVICE_URL=http://llm-service:8001
      - DB_PATH=/app/db/sure_history.db
    depends_on:
      - llm-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # RAG bilgi tabanı deposu. pgvector/pgvector imajı, PostgreSQL 17 + vector
  # eklentisini hazır getirir; ayrıca CREATE EXTENSION gerekmez (store.py yine
  # de idempotent olarak çalıştırır).
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_DB=sure_rag
      - POSTGRES_USER=sure
      # ⚠️ Üretimde POSTGRES_PASSWORD'ü mutlaka .env ile ver. Buradaki
      # varsayılan yalnızca kapalı ağ demosu içindir.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sure_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sure -d sure_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tek seferlik ingest: bilgi tabanını vektör deposuna yazar ve çıkar.
  # Ayrı servis olmasının nedeni, llm-service'in her açılışında embedding
  # üretmesini istememek — ingest yalnızca knowledge/ değiştiğinde gerekir.
  #   docker compose run --rm rag-ingest
  rag-ingest:
    build: ./llm-service
    command: ["python", "-m", "rag.ingest"]
    volumes:
      - model-cache:/model-cache
    environment:
      - HF_HOME=/model-cache
      - RAG_DATABASE_URL=postgresql://sure:${POSTGRES_PASSWORD:-sure_dev}@pgvector:5432/sure_rag
      - RAG_EMBED_MODEL=e5-small
      - RAG_CHUNK_STRATEGY=heading
    depends_on:
      pgvector:
        condition: service_healthy
    restart: "no"

  llm-service:
    build: ./llm-service
    ports:
      - "8001:8001"
    volumes:
      - model-cache:/model-cache          # HuggingFace model cache kalıcı
      - ./llm-service/sure-aqua-adapter:/adapter:ro   # fine-tune sonrası mount et
    environment:
      - AQUA_BASE_MODEL=KurmaAI/AQUA-1B
      - AQUA_ADAPTER_PATH=/adapter        # boşsa yüklenmez
      - AQUA_MAX_TOKENS=512
      - HF_HOME=/model-cache
      # RAG. Bu değerler rag/bench.py ve rag/calibrate.py ölçümleriyle seçildi;
      # değiştirmeden önce ölçümü tekrarla.
      - RAG_DATABASE_URL=postgresql://sure:${POSTGRES_PASSWORD:-sure_dev}@pgvector:5432/sure_rag
      - RAG_EMBED_MODEL=e5-small
      - RAG_CHUNK_STRATEGY=heading
      - RAG_TOP_K=4
      - RAG_MIN_SIMILARITY=0.85
    depends_on:
      pgvector:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vision-service:
    build: ./vision-service
    volumes:
      - ./data:/app/../data
      - ./sure_models:/app/../sure_models:ro
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:8000
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  model-cache:
  backend-db:
  pgdata:
